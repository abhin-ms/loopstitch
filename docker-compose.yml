services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:9001:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://loopstitch:${MYSQL_PASSWORD}@db:3306/loopstitch
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1,https://loopstitch.online,https://www.loopstitch.online
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ORDER_PAYMENT_TIMEOUT_MINUTES: ${ORDER_PAYMENT_TIMEOUT_MINUTES:-30}
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-otp_verification}
      WHATSAPP_ORDER_TEMPLATE: ${WHATSAPP_ORDER_TEMPLATE:-order_confirm}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en}
      WHATSAPP_SHIPPED_TEMPLATE: ${WHATSAPP_SHIPPED_TEMPLATE:-order_shipped}
      WHATSAPP_LAUNCH_TEMPLATE: ${WHATSAPP_LAUNCH_TEMPLATE:-store_launch}
      WHATSAPP_WELCOME_TEMPLATE: ${WHATSAPP_WELCOME_TEMPLATE:-subscribe_confirm}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Loopstitch <info@loopstitch.online>}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      OTP_HOURLY_CAP: ${OTP_HOURLY_CAP:-200}
      DELHIVERY_API_TOKEN: ${DELHIVERY_API_TOKEN:-}
      DELHIVERY_BASE_URL: ${DELHIVERY_BASE_URL:-https://track.delhivery.com}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-loopstitch}
      GCS_SERVICE_ACCOUNT_B64: ${GCS_SERVICE_ACCOUNT_B64}
    volumes:
      - uploads_data:/app/backend/uploads
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: loopstitch
      MYSQL_USER: loopstitch
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mariadb_data:
  uploads_data:
