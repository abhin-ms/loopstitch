services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:9001:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://loopstitch:${MYSQL_PASSWORD}@db:3306/loopstitch
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1,https://loopstitch.online,https://www.loopstitch.online
      RAZORPAY_KEY_ID: rzp_test_TZslh7TmYR4D1r
      RAZORPAY_KEY_SECRET: GU2vamsQlCqsMyPAcJ46k5Ci
      WHATSAPP_PHONE_NUMBER_ID: "1244794582058849"
      WHATSAPP_ACCESS_TOKEN: EAAc5gDWMHRQBSVy3kLBDnRENJhT5wV4YNOAtSK3BEpbNQ3XNwo9FkY0lkfuPj8fQT9DHefOWTg8BDGKBpUfKYfMzYVAhavmfZAme1TrxEt6wsblpK0pQdGfIAVWHyYuxj7FZAkvz3ASIMo0xFwY8LiZAiIplAQsUMN86EchvxOH9nnsddZCX8XABhRwRPQZDZD
      WHATSAPP_API_VERSION: v23.0
      GCS_BUCKET_NAME: loopstitch
      GCS_SERVICE_ACCOUNT_B64: ${GCS_SERVICE_ACCOUNT_B64}
      # Delhivery — auto shipment + pickup (order date + 3 days) after payment
      DELHIVERY_TOKEN: ${DELHIVERY_TOKEN:-}
      DELHIVERY_PICKUP_LOCATION: ${DELHIVERY_PICKUP_LOCATION:-}
      DELHIVERY_MODE: ${DELHIVERY_MODE:-staging}
      DELHIVERY_AUTO: ${DELHIVERY_AUTO:-true}
      DELHIVERY_PICKUP_AFTER_DAYS: ${DELHIVERY_PICKUP_AFTER_DAYS:-3}
      DELHIVERY_PICKUP_TIME: ${DELHIVERY_PICKUP_TIME:-14:00:00}
      DELHIVERY_SKIP_SUNDAY: ${DELHIVERY_SKIP_SUNDAY:-true}
      DELHIVERY_HOLIDAYS: ${DELHIVERY_HOLIDAYS:-}
      DELHIVERY_WEIGHT_PER_ITEM_G: ${DELHIVERY_WEIGHT_PER_ITEM_G:-350}
    volumes:
      - uploads_data:/app/backend/uploads
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: loopstitch
      MYSQL_USER: loopstitch
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mariadb_data:
  uploads_data:
