server {
    listen 80;
    server_name _;

    client_max_body_size 30M;  # reel videos are up to 25 MB

    # basic hardening for every response
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # files are saved with server-chosen image/pdf extensions; never let the browser guess a type
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sitemap is generated from the database so every product is listed
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Admin screens: never indexed by search engines
    location /admin {
        root /usr/share/nginx/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # add_header here replaces the server-level ones, so repeat them
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # serve the app shell here (not via an internal redirect) so the header is kept
        rewrite ^ /index.html break;
    }

    # Cart, checkout, order pages and the installable app shell: private, never indexed
    location ~ ^/(cart|checkout|order|orders|app)(/|$) {
        root /usr/share/nginx/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        rewrite ^ /index.html break;
    }

    # Real files (icons, images, scripts): a missing one is a 404, not the web page
    location ~* \.(ico|png|jpe?g|webp|svg|gif|js|css|json|xml|txt|webmanifest|woff2?)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Product feeds for Meta catalogue and Google Merchant Center
    location = /feeds/meta.csv {
        proxy_pass http://127.0.0.1:8000/api/feeds/meta-catalog.csv;
        proxy_set_header Host $host;
    }
    location = /feeds/google.xml {
        proxy_pass http://127.0.0.1:8000/api/feed/google.xml;
        proxy_set_header Host $host;
    }

    # Home, shop and the other public pages: sent with their real title, heading and text
    # already in the HTML (see /api/render). If the API is down, fall back to the app shell.
    location = / {
        proxy_pass http://127.0.0.1:8000/api/render/page/home;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }
    location ~ ^/(shop|customize|faq|about|blog|anime-oversized-tshirts|oversized-tshirts|acid-wash-tshirts|custom-tshirt-printing)/?$ {
        proxy_pass http://127.0.0.1:8000/api/render/page/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }

    # Product and journal pages: the API fills in the real title, image and price so
    # WhatsApp / Instagram / Google see them. If the API is down, fall back to the app shell.
    location ~ ^/(product|blog)/([A-Za-z0-9_-]+)/?$ {
        proxy_pass http://127.0.0.1:8000/api/render/$1/$2;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
