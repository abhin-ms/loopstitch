server {
    listen 80;
    server_name _;

    client_max_body_size 30M;  # reel videos are up to 25 MB

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sitemap is generated from the database so every product is listed
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Admin screens: never indexed by search engines
    location /admin {
        root /usr/share/nginx/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # serve the app shell here (not via an internal redirect) so the header is kept
        rewrite ^ /index.html break;
    }

    # Real files (icons, images, scripts): a missing one is a 404, not the web page
    location ~* \.(ico|png|jpe?g|webp|svg|gif|js|css|json|xml|txt|webmanifest|woff2?)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Product and journal pages: the API fills in the real title, image and price so
    # WhatsApp / Instagram / Google see them. If the API is down, fall back to the app shell.
    location ~ ^/(product|blog)/([A-Za-z0-9_-]+)/?$ {
        proxy_pass http://127.0.0.1:8000/api/render/$1/$2;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
